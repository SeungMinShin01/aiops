spring:
  application:
    name: aiops-server
  profiles:
    default: local              # 아무것도 안 주면 local로 뜬다

  datasource:                   # 서버 런타임 = app 계정 (테이블 소유자 아님 → 11단계 RLS 대상)
    url: ${AIOPS_DB_URL}
    username: ${AIOPS_DB_APP_USER}
    password: ${AIOPS_DB_APP_PASSWORD}

  flyway:                       # 마이그레이션 = owner 계정 (테이블 소유자)
    user: ${AIOPS_DB_OWNER_USER}
    password: ${AIOPS_DB_OWNER_PASSWORD}
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:               # GitHub 로그인 (AI-78). 값은 환경변수만 (규칙 10). 콜백 /login/oauth2/code/github
            client-id: ${AIOPS_GITHUB_CLIENT_ID:local-unset}   # 비어 있으면 Spring이 기동을 거부해서 테스트·CI용 자리표시자 (비밀 아님)
            client-secret: ${AIOPS_GITHUB_CLIENT_SECRET:}
            scope: read:user    # 이메일·레포 권한 요구하지 않음 (3-2)

  jpa:
    open-in-view: false         # 요청 끝까지 DB 연결을 붙잡지 않는다
    hibernate:
      ddl-auto: validate        # 테이블은 Flyway만 만든다. JPA는 맞는지 검사만

server:
  port: 8080
  servlet:
    session:
      cookie:                   # 콘솔 세션 쿠키 (AI-79). 같은 도메인이라 Lax로 충분, None 금지
        name: AIOPS_SESSION
        http-only: true
        secure: true            # 로컬(http)은 application-local.yml에서 false
        same-site: lax

aiops:
  ingest:
    max-body-bytes: 1048576     # 수집 본문 크기 한도 (IngestBodySizeFilter, AI-31)
  processing:
    threads: 4                  # AI-50 : 처리 풀 스레드 수
    queue: 1000                 # AI-50 : 처리 풀 대기줄 크기
  reprocess:
    interval: PT5M              # AI-53 : 재처리 주기 (이전 실행이 끝난 뒤 5분)
    initial-delay: PT1M         # AI-53 : 서버 시작 후 첫 실행까지 기다리는 시간
    min-age: PT2M               # AI-53 : 이 시간보다 오래된 미처리 이벤트만 줍는다
    batch: 500                  # AI-53 : 한 번에 줍는 최대 개수
  retention:
    local-days: 3               # AI-61 : local 키 이벤트 보관 일수
    prod-days: 14               # AI-61 : prod 키 이벤트 보관 일수
    cron: "0 0 4 * * *"         # AI-61 : 매일 04:00 (Asia/Seoul)
    batch-size: 5000            # AI-61 : 한 번에 지우는 최대 행 수
    pause-ms: 200               # AI-61 : 묶음 사이에 쉬는 시간(ms)
  notify:
    per-minute: 10              # 팀별 분당 디스코드 알림 상한. 넘으면 버린다 (AI-59)
  apikey:
    cache-ttl: 60s              # 키 캐시 유효 시간 (AI-74). 폐기는 evict로 즉시 반영, 이건 상한선
  discord:                      # 값은 전부 환경변수 (규칙 10). 비어 있으면 디스코드 연동은 건너뛴다 (테스트·CI가 값 없이 뜨도록 기본값 빈 문자열)
    guild-id: ${AIOPS_DISCORD_GUILD_ID:}
    bot-token: ${AIOPS_DISCORD_BOT_TOKEN:}
    client-id: ${AIOPS_DISCORD_CLIENT_ID:}
    client-secret: ${AIOPS_DISCORD_CLIENT_SECRET:}
    redirect-uri: ${AIOPS_DISCORD_REDIRECT_URI:http://localhost:8080/api/discord/callback}
  state-secret: ${AIOPS_STATE_SECRET:}  # 디스코드 연결 OAuth state 서명 키 (AI-93). 비밀값 — 환경변수로만
  console:
    base-url: ${AIOPS_CONSOLE_BASE_URL:}   # 콘솔 주소. 비어 있으면 같은 도메인 상대 경로로 redirect (디스코드 연결 콜백 → /teams/{id}/settings, AI-93)
    recent-events: 5            # AI-96 : 에러 상세에 보여 주는 최근 원본 건수
    daily-window: 14            # AI-96 : 에러 상세의 일별 횟수 며칠치
    connected-within: 3m        # AI-98 : 마지막 신호가 이 시간 안이면 "연결됨" (heartbeat 60초 × 3회 놓침 허용). 관리자 현황 판정도 같은 값
  invite:                       # 초대 링크 유효 기간 (14단계, A와 합의)
    owner-ttl: 7d               # 조장 링크 (13단계 관리자 발급, max_uses=1)
    member-ttl: 7d              # 팀원 링크 (AI-89 조장 발급)
  admin:
    github-ids: ${AIOPS_ADMIN_GITHUB_IDS:}   # 관리자 GitHub id (쉼표 구분 숫자). 비어 있으면 관리자 없음 (A-06)
  llm:                          # AI-54 : OpenAI 호환 chat API. 키가 비어 있으면 FakeLlmClient
    api-key: ${AIOPS_LLM_API_KEY:}          # 비밀값 — 환경변수로만 (규칙 10)
    base-url: ${AIOPS_LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${AIOPS_LLM_MODEL:gemini-3.5-flash-lite}   # 3.8-flash는 응답이 20초를 넘겨 실패 (11/15 확인)
    timeout: 20s                # 연결·읽기 타임아웃
    daily-limit: 200            # AI-57 : 하루 LLM 호출 상한 (전체 팀 합산). 넘으면 설명 없이 진행
    retry-window: PT24H         # AI-57 : 이 시간 안에 생긴 그룹만 설명을 다시 시도
    retry-min-age: PT2M         # AI-57 : 만든 지 이 시간이 지난 그룹만 다시 시도 (방금 생긴 그룹은 처리 스레드가 설명 중)
    retry-batch: 50             # AI-57 : 한 주기에 다시 시도하는 최대 그룹 수
    retry-interval: PT5M        # AI-57 : 재시도 주기 (이전 실행이 끝난 뒤)
    retry-initial-delay: PT2M   # AI-57 : 서버 시작 후 첫 재시도까지