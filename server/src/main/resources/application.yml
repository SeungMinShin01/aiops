spring:
  application:
    name: aiops-server
  profiles:
    default: local              # 아무것도 안 주면 local로 뜬다

  datasource:                   # 서버 런타임 = app 계정 (테이블 소유자 아님 → 11단계 RLS 대상)
    url: ${AIOPS_DB_URL}
    username: ${AIOPS_DB_APP_USER}
    password: ${AIOPS_DB_APP_PASSWORD}

  flyway:                       # 마이그레이션 = owner 계정 (테이블 소유자)
    user: ${AIOPS_DB_OWNER_USER}
    password: ${AIOPS_DB_OWNER_PASSWORD}
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:               # GitHub 로그인 (AI-78). 값은 환경변수만 (규칙 10). 콜백 /login/oauth2/code/github
            client-id: ${AIOPS_GITHUB_CLIENT_ID:local-unset}   # 비어 있으면 Spring이 기동을 거부해서 테스트·CI용 자리표시자 (비밀 아님)
            client-secret: ${AIOPS_GITHUB_CLIENT_SECRET:}
            scope: read:user    # 이메일·레포 권한 요구하지 않음 (3-2)

  jpa:
    open-in-view: false         # 요청 끝까지 DB 연결을 붙잡지 않는다
    hibernate:
      ddl-auto: validate        # 테이블은 Flyway만 만든다. JPA는 맞는지 검사만

server:
  port: 8080
  servlet:
    session:
      cookie:                   # 콘솔 세션 쿠키 (AI-79). 같은 도메인이라 Lax로 충분, None 금지
        name: AIOPS_SESSION
        http-only: true
        secure: true            # 로컬(http)은 application-local.yml에서 false
        same-site: lax

aiops:
  ingest:
    max-body-bytes: 1048576     # 수집 본문 크기 한도 (IngestBodySizeFilter, AI-31)
  processing:
    threads: 4                  # AI-50 : 처리 풀 스레드 수
    queue: 1000                 # AI-50 : 처리 풀 대기줄 크기
  notify:
    per-minute: 10              # 팀별 분당 디스코드 알림 상한. 넘으면 버린다 (AI-59)
  apikey:
    cache-ttl: 60s              # 키 캐시 유효 시간 (AI-74). 폐기는 evict로 즉시 반영, 이건 상한선
  discord:                      # 값은 전부 환경변수 (규칙 10). 비어 있으면 디스코드 연동은 건너뛴다 (테스트·CI가 값 없이 뜨도록 기본값 빈 문자열)
    guild-id: ${AIOPS_DISCORD_GUILD_ID:}
    bot-token: ${AIOPS_DISCORD_BOT_TOKEN:}
    client-id: ${AIOPS_DISCORD_CLIENT_ID:}
    client-secret: ${AIOPS_DISCORD_CLIENT_SECRET:}
    redirect-uri: ${AIOPS_DISCORD_REDIRECT_URI:http://localhost:8080/api/discord/callback}
  admin:
    github-ids: ${AIOPS_ADMIN_GITHUB_IDS:}   # 관리자 GitHub id (쉼표 구분 숫자). 비어 있으면 관리자 없음 (A-06)
